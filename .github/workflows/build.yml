name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
      RELEASE_STORE_FILE: /tmp/release.keystore
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      ORG_GRADLE_PROJECT_appVersionCode: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        run: |
          if [ "$IS_RELEASE" = "true" ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_appVersionName=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 37
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Only tag builds are signed; branch and PR builds (no secrets on forks) stay unsigned.
      - name: Restore release keystore
        if: env.IS_RELEASE == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" && test -n "$RELEASE_STORE_PASSWORD" && test -n "$RELEASE_KEY_ALIAS" && test -n "$RELEASE_KEY_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RELEASE_STORE_FILE"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ "$IS_RELEASE" = "true" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
            cp "$APK" "dist/J7WifiOpen-$APP_VERSION.apk"
          else
            cp "$APK" "dist/J7WifiOpen-$APP_VERSION-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: J7WifiOpen-${{ env.APP_VERSION }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --title "J7 WiFi Open $GITHUB_REF_NAME" --generate-notes
